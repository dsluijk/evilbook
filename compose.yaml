services:
  chatchal:
    build: .
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      PORT: 8080
      # The name this deployment posts under. There is no way to change it from the
      # browser, so it is set once here.
      AUTHOR: ${AUTHOR:-anon}
      # How many messages to retain. A client whose cursor falls outside this window is
      # told to refetch rather than served a gap. Override it to exercise that path:
      #   CAPACITY=5 docker compose up -d --force-recreate
      CAPACITY: ${CAPACITY:-500}
      # Fake villains post into the chat every few seconds. Set to "off" to silence them.
      CHATTER: ${CHATTER:-on}
    # Messages live in memory, so a restart drops history. Connected clients handle
    # that themselves: the fresh server cannot find the message their cursor names, so
    # it answers `reset`, and they refetch. A restart is a recovery here, not an
    # outage — which is the point of the design.
    restart: unless-stopped
    healthcheck:
      # No curl in the image, and no reason to add one: node can make the request.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/api/messages').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
