<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eleven Eyes</title>
  </head>
  <body>
    <main class="chat">
      <header class="chat__header">
        <div class="chat__title">
          <span class="stamp" aria-hidden="true">Secure Channel</span>
          <h1>Eleven Eyes</h1>
        </div>
        <p
          class="identity"
          title="Messages from this server are posted under this name"
        >
          <span class="identity__label">Posting as</span>
          <span id="identity" class="identity__name"></span>
        </p>
      </header>

      <div
        class="status"
        id="status"
        data-state="connecting"
        role="status"
        aria-live="polite"
      >
        <span class="status__dot" aria-hidden="true"></span>
        <span class="status__text" id="status-text"
          >Establishing secure line…</span
        >
      </div>

      <ol class="messages" id="messages"></ol>

      <form class="composer" id="composer">
        <input
          type="text"
          id="input"
          class="composer__input"
          placeholder="Transmit a message…"
          autocomplete="off"
          maxlength="2000"
        />
        <button type="submit" class="composer__send" id="send">Transmit</button>
      </form>
    </main>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
